ak_motor_cable_control_node:
  ros__parameters:
    can_interface: "can0"
    motor_id: 1
    motor_name: "ak40_10"
    poll_rate_hz: 100.0
    # AK40-10 MIT-mode physical limits
    p_min: -12.5   # rad
    p_max:  12.5   # rad
    v_min: -45.5   # rad/s
    v_max:  45.5   # rad/s
    t_min:  -5.0   # Nm
    t_max:   5.0   # Nm
    kp_max: 500.0  # Nm/rad
    kd_max:   5.0  # Nms/rad
    # Speed mode gain (kp is always 0 in speed mode)
    kd_speed: 0.5   # Nms/rad
    # Position mode gains
    kp_pos: 1.0     # Nm/rad
    kd_pos: 0.3     # Nms/rad
    # Safety
    command_timeout_ms: 500.0
    kd_watchdog: 0.05
    heartbeat_timeout_ms: 1500.0
    temp_limit_c: 75.0
    # External mode torque clamp
    torque_limit_upper:  1.5    # N.m  (AK40-10 peak: 1.9 N.m)
    torque_limit_lower: -1.5    # N.m
    # Cable drum geometry
    drum_radius: 0.036           # m (36 mm)
    # Auto zero (~/auto_zero): retract until the cable stopper hits the housing.
    # Run with no payload. Stall torque cap = homing_kd * homing_speed (0.4 N.m ~ 11 N on cable).
    homing_speed:          1.0     # rad/s retract (~36 mm/s)
    homing_kd:             0.4     # N.m.s/rad
    homing_contact_torque: 0.25    # N.m measured torque => contact (must be < kd * speed)
    homing_stall_speed:    0.2     # rad/s, |vel| below this counts as stalled
    homing_debounce_ms:    100.0   # contact must hold this long
    homing_blanking_ms:    300.0   # ignore breakaway at start
    homing_max_travel:     1.2     # m retracted before giving up
    homing_backoff:        0.015   # m paid out after contact (park position)
    homing_timeout_s:      60.0
